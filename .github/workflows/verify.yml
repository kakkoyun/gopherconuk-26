name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: typos-cli@1.48.0
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: go install golang.org/x/tools/cmd/goimports@v0.45.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: make check
        env:
          CHROME_PATH: /usr/bin/google-chrome
