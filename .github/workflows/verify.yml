name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: tools/cli/kubectl-obi/go.sum
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: typos-cli@1.48.0
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: go install golang.org/x/tools/cmd/goimports@v0.45.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: make check
        env:
          CHROME_PATH: /usr/bin/google-chrome
